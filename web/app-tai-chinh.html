<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP TÀI CHÍNH</title>
<style>:root{--bg:#f1f4f9;--sf:#fff;--tx:#0f172a;--mut:#64748b;--ln:#e2e8f0;--ac:#1d4ed8;--ac2:#0f766e;--acs:#eef2fb;--bad:#b91c1c;--r:14px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);--navy:#0b1f3a;--navy2:#16407a;--acring:rgba(29,78,216,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--sf:#111a2e;--tx:#e6ecf5;--mut:#94a3b8;--ln:#22304a;--ac:#7aa7ff;--ac2:#34d3b4;--acs:#172540;--bad:#ff8a80;--navy:#060d19;--navy2:#0f2a52;--acring:rgba(122,167,255,.25)}}
:root[data-theme=dark]{--bg:#0b1220;--sf:#111a2e;--tx:#e6ecf5;--mut:#94a3b8;--ln:#22304a;--ac:#7aa7ff;--ac2:#34d3b4;--acs:#172540;--bad:#ff8a80;--navy:#060d19;--navy2:#0f2a52;--acring:rgba(122,167,255,.25)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ok{background:var(--ac2);border-color:var(--ac2);color:#fff}.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{resize:vertical;line-height:1.55}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
/* đăng nhập */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(rgba(8,20,40,.35),rgba(8,20,40,.35)),var(--bgimg) center/cover no-repeat,#0b2a4a;position:relative;overflow:hidden}
.login .deco{position:absolute;inset:0;opacity:.16;pointer-events:none;display:flex;align-items:flex-end;justify-content:flex-end}
.login .deco svg{width:min(70vw,520px);height:auto;margin:0 -30px -30px 0}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid var(--ln)}
.login .box{width:100%;max-width:400px;position:relative;z-index:1}
.login h1{font-size:20px;margin:6px 0 2px;text-align:center}.login p.sub{margin:0 0 16px;text-align:center;color:var(--mut);font-size:13px}
.login .logo{width:72px;height:72px;margin:0 auto;display:block}
.icons{display:flex;gap:8px;justify-content:center;margin-top:14px}.icons button{border:1px solid var(--ln);background:var(--sf);border-radius:10px;width:44px;height:44px;cursor:pointer;padding:6px}.icons button[aria-pressed=true]{border-color:var(--ac);background:var(--acs)}.icons svg{width:100%;height:100%}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
/* khung */
header.top{background:var(--ac);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:16px;margin:0;flex:1;min-width:180px}
header.top .who{font-size:13px;opacity:.9}
header.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
nav.tabs{display:flex;gap:2px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto;padding:0 8px}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ac);border-bottom-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2{grid-template-columns:1fr 1fr}}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.step{display:flex;gap:10px;align-items:center;margin-bottom:10px}.step b{background:var(--ac);color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.filebox{border:2px dashed var(--ln);border-radius:var(--r);padding:14px;background:var(--bg)}
.filebox.ok{border-color:var(--ac2);border-style:solid}.filebox .nm{font-size:13px;color:var(--mut);word-break:break-all;margin-top:4px}
.tw{overflow-x:auto}table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.t th,table.t td{border:1px solid var(--ln);padding:6px 8px;text-align:right}table.t th{background:var(--acs);text-align:center}table.t td:first-child,table.t td:nth-child(2){text-align:left}
table.t tr.tot td{font-weight:700;background:var(--acs)}
.muted{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.warn{background:#fff6e0;color:#6b4a00;border:1px solid #f0d28a;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .warn{background:#3a2e10;color:#ffd98a;border-color:#6b5320}}
.bars{display:grid;gap:6px;margin:8px 0}.bar{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--ac2)}.bar .tr{background:var(--ln);border-radius:7px;position:relative;height:14px}.bar .tr s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
@media(max-width:720px){.bar{grid-template-columns:100px 1fr 58px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#14233a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}.toast.bad{background:var(--bad)}
.para{margin-bottom:10px}
/* ghi chú, đối chiếu tệp */
.auto{font-weight:400;color:var(--ac2);font-size:12px}
.chk{font-size:13px;margin-top:6px;color:var(--ac2);line-height:1.45}.chk div{word-break:break-word}
.ok-note{background:#e7f6ee;color:#0b5a3a;border:1px solid #a9dcc3;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 10px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .ok-note{background:#123526;color:#9be4c1;border-color:#2a6a4d}}
/* bảng phụ lục dự toán (cân đối, thu, chi) */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.subtabs button{border:1px solid var(--ln);border-bottom:0;background:var(--bg);border-radius:10px 10px 0 0;padding:8px 18px;cursor:pointer;font-weight:600;color:var(--mut);min-height:38px}
.subtabs button[aria-selected=true]{background:var(--sf);color:var(--ac);border-color:var(--ac);position:relative;top:1px}
.dtitle{text-align:center;margin:4px 0 10px;line-height:1.45}.dtitle .tb{font-weight:700}.dtitle .ti{font-style:italic}
table.dtab{min-width:520px}table.dtab td.c{text-align:center;width:56px}table.dtab td:nth-child(2){text-align:left}
table.dtab tr.rb td{font-weight:700}table.dtab tr.ri td:nth-child(2){font-style:italic}table.dtab tr.note td{text-align:left;font-size:13px;color:var(--mut);border-left:0;border-right:0}
table.dtab td.n{padding:2px 4px}
input.ni{text-align:right;min-height:32px;padding:4px 8px;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;font-variant-numeric:tabular-nums}
input.ni:hover,input.ni:focus{border-color:var(--ln);background:var(--sf)}
tr.rb input.ni{font-weight:700}
.sumline{font-size:13px;margin-top:10px;padding:8px 12px;background:var(--acs);border-radius:10px}
/* menu quản trị ở đầu trang */
.adm{position:relative}.adm>button{display:inline-flex;align-items:center;gap:6px}
.adm svg{width:18px;height:18px}.adm .car{width:12px;height:12px;transition:transform .15s}.adm>button[aria-expanded=true] .car{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;box-shadow:0 8px 24px rgba(20,35,58,.22);min-width:230px;padding:6px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:42px}
.menu button:hover,.menu button:focus-visible{background:var(--acs)}.menu small{display:block;color:var(--mut);font-size:12px}
.ovl{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.dlg{width:100%;max-width:380px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:76px}
.opt b{color:var(--ac);font-size:15px}.opt span{color:var(--mut);font-size:13px}.opt:hover{border-color:var(--ac)}.opt.soon{opacity:.7;border-style:dashed}
.pbox{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}.pbox .pt{font-weight:700;color:var(--ac);margin-bottom:6px;font-size:13px}.pbox textarea{margin-bottom:6px}
.colsel{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0}.cgrp{display:flex;gap:8px;align-items:center;font-size:13px}label.ck{display:inline-flex;gap:5px;align-items:center;color:var(--tx);font-size:13px;margin:0}label.ck input{width:auto;min-height:0}
table.prev th{font-size:13px}table.prev td{font-size:13px}table.prev tr.off td{opacity:.4}table.prev td.c{text-align:center}table.prev input[type=checkbox]{width:auto;min-height:0}

.bad-t{color:var(--bad)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--ln);color:var(--mut)}.badge.fin{background:#e7f6ee;color:#0b5a3a;border-color:#a9dcc3}.badge.draft{background:#fff6e0;color:#6b4a00;border-color:#f0d28a}
.infosum{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.infosum b{color:var(--tx)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
table.dlist{table-layout:fixed;min-width:960px}table.dlist td.c,table.dlist td:first-child{text-align:center}table.dlist td.n{text-align:right}table.dlist th{font-size:13px}
.topbar{margin-bottom:12px}
.ok-t{color:var(--ac2);font-weight:600}
table.dlist{min-width:1000px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.split .pane{min-width:0}@media(max-width:1000px){.split{grid-template-columns:1fr}}
.split textarea{resize:vertical;overflow:hidden}
.bad-note{background:#fdecea;color:#7a1410;border:1px solid #f0aaa5;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 10px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bad-note{background:#3a1b19;color:#ffb4ab;border-color:#7a3a35}}
:root[data-theme=dark] .bad-note{background:#3a1b19;color:#ffb4ab;border-color:#7a3a35}
table.ulist tr[data-u]{cursor:pointer}table.ulist tr.sel td{background:var(--acs)}table.ulist td.c{text-align:center}table.ulist{min-width:760px;font-size:13px}
.exp{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin-top:8px}
.viewctl{gap:6px 18px;margin:6px 0 10px;align-items:center}
.utabs{flex-wrap:wrap}
.sx{position:sticky;background:var(--sf);z-index:1}th.sx{background:var(--acs);z-index:3}
.sx1{left:0;min-width:2.8em;width:2.8em}.sx2{left:2.8em;min-width:3.4em;width:3.4em}.sx3{left:6.2em;min-width:15em;width:15em;box-shadow:2px 0 0 var(--ln)}
.zbox{font-size:13px}.wscroll{max-height:68vh;overflow:auto;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.zbox table.prev,.zbox table.prev th,.zbox table.prev td{font-size:1em}.zbox table.prev{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.zbox table.prev th,.zbox table.prev td{padding:.3em .45em}.zbox table.prev th{position:sticky;top:0;z-index:2}.zbox table.prev th.sx{z-index:5}
.zbox input.ni{font-size:1em;width:6.5em;min-height:0}.zbox textarea{font-size:1em}.zbox .pbox{margin:8px}
.phead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:6px}.zbar{font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--tx)}
.flist{margin-top:6px}.frow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--ln);font-size:13px}.frow .ft{font-weight:600;word-break:break-all}.frow{flex-wrap:wrap}.frow .fi{flex-basis:100%;order:3;color:var(--mut);font-size:12px}.frow.bad .ft,.frow.bad .fi{color:var(--bad)}
input.ucell{min-height:32px;padding:4px 6px;border-radius:8px}table.ulist td.c{white-space:nowrap}.lk{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:600}#i-nam{min-height:34px;padding:4px 8px}.dtrow>td{background:var(--bg)}

#pv-s .sx3{min-width:11em;width:11em}.zbox table.prev th,.zbox table.prev td{padding:.3em .35em}
.totop{position:fixed;right:18px;bottom:18px;z-index:60;box-shadow:var(--sh)}.totop[hidden]{display:none}
.listbar{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;font-size:16px}.listbar .muted{flex:1;font-size:13px}.listbar .arr{font-size:16px}
ol.rules{margin:0;padding-left:20px;display:grid;gap:8px}ol.rules li{line-height:1.55}table.rules{min-width:760px;font-size:13px}table.rules td.c{text-align:center}code{background:var(--acs);padding:1px 5px;border-radius:5px;font-size:.92em}
.zbox input.tdi{background:var(--acs);border:1px solid var(--ln);border-radius:6px;padding:.15em .3em;text-align:right;width:6.2em}.tdi-demo{background:var(--acs);padding:0 6px;border-radius:5px}
table.tdt tr.man td{background:rgba(250,204,21,.12)}table.tdt tr.man td.sx{background:var(--sf)}.zbox input.tdn{width:100%;min-width:12em;font-size:1em;min-height:0;padding:.15em .3em}
table.tdt tr.blk td{font-weight:700;background:var(--bg)}table.tdt tr.blk td.sx{background:var(--sf)}table.tdt td{text-align:right}#pv-t .sx3{min-width:20em;width:20em}

/* ===== giao diện công sở (lớp phủ cuối cùng) ===== */
body{font:14.5px/1.55 "Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
table,input.ni,.bar b,.sumline,td,th{font-variant-numeric:tabular-nums}
main{max-width:1280px;padding:22px 24px 48px}
header.top{background:linear-gradient(90deg,var(--navy),var(--navy2));padding:12px 24px;box-shadow:0 2px 10px rgba(11,31,58,.28);position:sticky;top:0;z-index:40}
header.top h1{font-size:15px;font-weight:700;letter-spacing:.08em}
header.top .who{font-size:13px;opacity:.85}
header.top .btn{border-radius:8px;min-height:36px;padding:6px 12px;font-size:13px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28)}
header.top .btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
nav.tabs{padding:0 20px;gap:4px;box-shadow:0 1px 0 var(--ln);position:sticky;top:60px;z-index:30}
nav.tabs button{padding:14px 16px;font-size:14px;font-weight:600;border-bottom-width:3px;transition:color .15s,background .15s}
nav.tabs button:hover{color:var(--tx);background:var(--acs)}
.card{border-radius:var(--r);padding:22px 24px;border:1px solid var(--ln)}
h2{font-size:18px;font-weight:650;letter-spacing:-.005em}
h3{font-size:14px;font-weight:650;color:var(--tx)}
.step b{border-radius:8px;width:28px;height:28px;background:var(--navy2)}
.step h2{font-size:17px}
.btn{border-radius:8px;min-height:40px;padding:8px 16px;font-weight:500;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{border-color:var(--ac);background:var(--acs)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 1px 2px rgba(29,78,216,.35)}.btn.pri:hover{filter:brightness(1.08);background:var(--ac)}
.btn.ok{background:var(--ac2);border-color:var(--ac2);color:#fff;box-shadow:0 1px 2px rgba(15,118,110,.35)}.btn.ok:hover{filter:brightness(1.08);background:var(--ac2)}
.btn.sm{min-height:32px;padding:4px 12px;border-radius:7px}
input[type=text],input[type=password],input[type=number],select,textarea{border-radius:8px}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,button:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acring)}
label{font-weight:500}
/* thẻ chọn việc ở màn đầu */
.opt{position:relative;overflow:hidden;border:1px solid var(--ln);border-radius:var(--r);padding:20px 52px 20px 24px;min-height:96px;box-shadow:var(--sh);gap:6px;transition:transform .12s,box-shadow .12s,border-color .12s}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ac)}
.opt::after{content:"\2192";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--mut);transition:transform .12s,color .12s}
.opt:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 28px rgba(15,23,42,.1)}.opt:hover::after{color:var(--ac);transform:translate(4px,-50%)}
.opt b{color:var(--tx);font-size:16px;font-weight:650}.opt span{color:var(--mut);font-size:13.5px;line-height:1.5}
.grid>.opt:nth-child(2)::before{background:var(--ac2)}.grid>.opt:nth-child(3)::before{background:#b45309}.grid>.opt:nth-child(4)::before{background:#6d28d9}.grid>.opt:nth-child(5)::before{background:#475569}
.listbar{padding:6px 0}.listbar b{font-size:16px}
/* bảng */
table.t{font-size:13.5px}
table.t th,table.t td{border:0;border-bottom:1px solid var(--ln);padding:8px 10px}
table.t th{background:var(--acs);color:var(--tx);font-weight:650;font-size:12.5px;border-bottom:2px solid var(--ln)}
table.t tbody tr:hover td,table.t tr:hover>td{background:rgba(29,78,216,.045)}
table.t tr.tot td{background:var(--acs)}
.tw{border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.tw table.t{border-radius:10px}
table.t th:first-child,table.t td:first-child{padding-left:14px}
table.ulist tr.sel td{background:var(--acs)}
.zbox table.prev th,.zbox table.prev td{border:0;border-bottom:1px solid var(--ln);border-right:1px solid var(--ln)}
.zbox table.prev th{background:var(--acs);color:var(--tx);font-weight:650;border-bottom:1px solid #cbd5e1}
.zbox table.prev tr.rb td{background:rgba(29,78,216,.035)}
.wscroll{border-radius:10px;border:1px solid var(--ln)}
.subtabs{gap:6px;border-bottom:1px solid var(--ln)}
.subtabs button{border-radius:8px 8px 0 0;font-size:14px;padding:8px 20px}
.subtabs button[aria-selected=true]{color:var(--ac);border-color:var(--ln);border-bottom:2px solid var(--sf);box-shadow:inset 0 3px 0 var(--ac)}
/* ghi chú, cảnh báo */
.warn,.ok-note,.bad-note{border-radius:8px;border-width:1px;border-left-width:4px;padding:10px 14px}
.warn{border-left-color:#d97706}.ok-note{border-left-color:#16a34a}.bad-note{border-left-color:#dc2626}
.filebox{border-radius:12px;background:var(--bg);border-width:1.5px;transition:border-color .15s,background .15s}.filebox:hover{border-color:var(--ac)}
.filebox.ok{background:rgba(15,118,110,.05)}
.filebox label{font-size:13.5px}
.exp{border-radius:10px;background:var(--acs)}

var B=window.TC_BOOT=window.TC_BOOT||{},P=window.TC_PARTS||{},SEP='\n/*@@TC_PART@@*/\n';
var root=document.getElementById('app'),g=null;try{g=window.google&&google.script&&google.script.run}catch(e){}
var lsg=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})};
/* --- kho trên máy (cùng kho với TC.need trong core.js) --- */
function idb(){return new Promise(function(ok,no){try{var r=indexedDB.open('tc_parts',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
function idbGet(k){return idb().then(function(d){return new Promise(function(ok){var q=d.transaction('p').objectStore('p').get(k);q.onsuccess=function(){ok(q.result==null?null:q.result)};q.onerror=function(){ok(null)}})}).catch(function(){return null})}
function idbPut(n,k,v){idb().then(function(d){var st=d.transaction('p','readwrite').objectStore('p'),c=st.openCursor();
  c.onsuccess=function(){var x=c.result;if(!x)return;if(String(x.key).indexOf('part:'+n+':')===0&&x.key!==k)x.delete();x.continue()};st.put(v,k)}).catch(function(){})}
function run(fn,a){return new Promise(function(ok,no){if(!g||!g[fn])return no(new Error('Không kết nối được máy chủ.'));
  g.withSuccessHandler(ok).withFailureHandler(function(e){no(e instanceof Error?e:new Error(String(e&&e.message||e)))})[fn](a)})}
function fetchPart(n){
  if(g&&g.getPartZ&&window.DecompressionStream)return run('getPartZ',n).then(function(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
    return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).catch(function(){return run('getPart',n)});
  return run('getPart',n)}
function getPart(n){var info=P[n];if(!info)return Promise.reject(new Error('Bản này thiếu phần '+n));var key='part:'+n+':'+info.v;
  return idbGet(key).then(function(c){if(typeof c==='string'&&(!info.len||c.length===info.len))return c;
    var tries=0;var go=function(){return fetchPart(n).catch(function(e){if(++tries<2)return go();throw e})};
    return go().then(function(c2){if(info.len&&c2.length!==info.len)throw new Error('Phần '+n+' tải về chưa đủ');idbPut(n,key,c2);return c2})})}
/* --- gửi lệnh máy chủ giống TC.srv.call --- */
function api(a,p){var q={a:a,t:B.tok||''};for(var k in p)q[k]=p[k];
  return run('api',JSON.stringify(q)).then(function(x){try{return JSON.parse(x)}catch(e){return{ok:false,err:'server',msg:'Máy chủ trả về dữ liệu lỗi.'}}},
    function(){return{ok:false,err:'net',msg:'Không kết nối được máy chủ, kiểm tra mạng rồi thử lại.'}})}
/* --- màn hình --- */
B.tok=lsg('tc_tok')||(function(){try{return sessionStorage.getItem('tc_tok')}catch(e){return null}})()||'';
var logo='<div class="logo" style="color:var(--ac);width:72px;height:72px;margin:0 auto">'+(B.pig?'<img src="'+B.pig+'" alt="" style="width:100%;height:100%;object-fit:contain">':'')+'</div><h1>APP TÀI CHÍNH</h1>';
function wait(msg){root.innerHTML='<div class="login"><div class="card box">'+logo+'<p class="sub" id="b-msg" style="margin:20px 0">'+esc(msg)+'</p></div></div>'}
function form(){var un=(function(){try{return JSON.parse(lsg('tc_tok_user')||'""')}catch(e){return''}})();
  root.innerHTML='<div class="login"><div class="card box">'+logo+'<p class="sub">Đăng nhập để tiếp tục</p>'+
  '<form id="lf" name="login" method="post" action="#" autocomplete="on">'+
  '<div style="margin-bottom:10px"><label>Tên đăng nhập</label><input type="text" id="l-u" name="username" autocomplete="username" autocapitalize="none"'+(un?' value="'+esc(un)+'"':'')+'></div>'+
  '<div style="margin-bottom:10px"><label>Mật khẩu</label><input type="password" id="l-p" name="password" autocomplete="current-password"></div>'+
  '<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-bottom:12px"><input type="checkbox" id="l-r" checked style="width:auto;min-height:0"> Ghi nhớ đăng nhập trên máy này</label>'+
  '<button class="btn pri" style="width:100%" type="submit">Đăng nhập</button><div class="err" id="le" role="alert"></div>'+
  '<p class="muted" id="b-st" style="margin:10px 0 0;font-size:12.5px;text-align:center">Đang tải ứng dụng, bạn cứ nhập tên và mật khẩu…</p></form></div></div>';
  var f=document.getElementById('lf'),$=function(id){return document.getElementById(id)};
  (un?$('l-p'):$('l-u')).focus();
  f.onsubmit=function(e){e.preventDefault();if(B.login)return;var u=$('l-u').value.trim(),p=$('l-p').value,err=$('le'),btn=f.querySelector('button[type=submit]');err.textContent='';
    if(!u||!p){err.textContent='Nhập tên đăng nhập và mật khẩu';return}
    B.u=u;B.keep=$('l-r').checked;btn.disabled=true;btn.textContent='Đang đăng nhập…';
    B.login=api('login',{u:u,p:p,keep:B.keep}).then(function(r){
      if(!r.ok&&!B.taken){B.login=null;btn.disabled=false;btn.textContent='Đăng nhập';err.textContent=r.msg||'Không đăng nhập được'}
      else if(r.ok&&!B.taken){btn.textContent='Đang mở ứng dụng…';var s=$('b-st');if(s)s.textContent='Đăng nhập xong, chờ tải nốt ứng dụng…'}
      return r})};
  /* app chính lấy lại chữ đã gõ nếu chưa bấm Đăng nhập */
  B.vals=function(){var a=document.activeElement;return{u:$('l-u')?$('l-u').value:'',p:$('l-p')?$('l-p').value:'',r:$('l-r')?$('l-r').checked:true,err:$('le')?$('le').textContent:'',focus:a&&a.id||''}}}
if(B.tok){wait('Đang tải…');B.me=api('me',{})}else form();
/* --- tải app chính, chạy theo thứ tự --- */
function start(){B.err=null;getPart('app').then(function(code){B.taken=true;code.split(SEP).forEach(function(src){var s=document.createElement('script');s.textContent=src;document.head.appendChild(s)})},
  function(e){B.err=e;var m='Chưa tải được ứng dụng ('+(e&&e.message||'lỗi mạng')+').';
    var box=document.getElementById('b-st')||document.getElementById('b-msg');if(box){box.innerHTML=esc(m)+' <button type="button" class="btn sm" id="b-re">Thử lại</button>';box.style.color='var(--bad)';
      document.getElementById('b-re').onclick=function(){box.style.color='';box.textContent='Đang tải lại…';start()}}})}
start();
/* ảnh nền: tải song song (đã có trên máy thì đọc ngay), app chính dùng lại qua TC_BOOT.bg */
if(P.bg)getPart('bg').then(function(c){var m=c.match(/'(data:image[^']*)'/);if(!m)return;B.bg=m[1];
  if(window.TC_IMG&&!window.TC_IMG.bg)window.TC_IMG.bg=m[1];
  var ls=document.querySelectorAll('.login');for(var i=0;i<ls.length;i++)ls[i].style.setProperty('--bgimg','url('+m[1]+')')}).catch(function(){});
})();
</script>
</body></html>
