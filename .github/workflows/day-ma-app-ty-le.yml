name: Day ma App ty le phan cap len Apps Script va trien khai
on:
  workflow_dispatch:
    inputs:
      trien_khai:
        description: "Trien khai vao link /exec chinh cua App ty le? (mac dinh: khong, chi day ma)"
        type: boolean
        default: false
      trien_khai_thu:
        description: "Tao ban trien khai THU rieng (link moi, khong dung /exec chinh)"
        type: boolean
        default: false
      quay_lai_phien_ban:
        description: "Chi dung khi can lui: so phien ban cu muon tra lai"
        type: string
        default: ""
      ma_link_thu:
        description: "Tuy chon: ma link THU da co (AKfycb...) de cap nhat dung link do thay vi tao link moi"
        type: string
        default: ""
      ghi_chu:
        description: "Ghi chu cho ban trien khai"
        type: string
        default: "Trien khai tu GitHub"
permissions:
  contents: read
concurrency:
  group: apps-script-deploy-app-ty-le
  cancel-in-progress: false
env:
  DEPLOYMENT_ID: AKfycbykyJgyXsiGOMc1M7uWbXoT_088vIhdULdb2YGbuu8U2WkHP93Dof9UwvMIrL1ZmcR41w
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai clasp
        run: npm install -g @google/clasp
      - name: Dang nhap clasp bang secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - name: Gop web (base64) va dau moc phien ban vao thu muc script
        if: ${{ inputs.quay_lai_phien_ban == '' }}
        run: |
          python3 - <<'PY'
          import base64, gzip
          # D1 (H duyet 06/11/2026): web nen gzip + base64 trong tep .html, script khoi nap khoi web moi lan goi
          b = base64.b64encode(gzip.compress(open("app-ty-le/web/app-ty-le-phan-cap.html", "rb").read(), 9)).decode()
          open("app-ty-le/script/w64_app_ty_le.html", "w").write(b)
          print("w64_app_ty_le", len(b))
          PY
          echo "var BUILD_TS = $(date +%s%3N);" > app-ty-le/script/build-info.js
      - name: Day ma len script
        if: ${{ inputs.quay_lai_phien_ban == '' }}
        working-directory: app-ty-le/script
        run: clasp push --force
      - name: Trien khai vao dung link /exec chinh
        if: ${{ inputs.trien_khai && inputs.quay_lai_phien_ban == '' }}
        working-directory: app-ty-le/script
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${{ inputs.ghi_chu }}"
      - name: Tao ban trien khai THU (link rieng)
        if: ${{ inputs.trien_khai_thu && inputs.quay_lai_phien_ban == '' }}
        working-directory: app-ty-le/script
        run: |
          if [ -n "${{ inputs.ma_link_thu }}" ]; then
            clasp deploy --deploymentId "${{ inputs.ma_link_thu }}" --description "THU: ${{ inputs.ghi_chu }}" | tee /tmp/dep.txt
          else
            clasp deploy --description "THU: ${{ inputs.ghi_chu }}" | tee /tmp/dep.txt
          fi
          id=$(grep -o 'AKfycb[A-Za-z0-9_-]*' /tmp/dep.txt | head -1)
          echo "LINK THU: https://script.google.com/macros/s/$id/exec"
      - name: Lui ve phien ban cu
        if: ${{ inputs.quay_lai_phien_ban != '' }}
        working-directory: app-ty-le/script
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "${{ inputs.quay_lai_phien_ban }}" --description "Lui ve phien ban ${{ inputs.quay_lai_phien_ban }}"
      - name: Xoa chia khoa
        if: always()
        run: rm -f ~/.clasprc.json
