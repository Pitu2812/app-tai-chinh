name: Day ma len Apps Script va trien khai
on:
  workflow_dispatch:
    inputs:
      trien_khai:
        description: "Co trien khai vao link /exec khong? (mac dinh: khong, chi day ma)"
        type: boolean
        default: false
      ghi_chu:
        description: "Ghi chu cho ban trien khai"
        type: string
        default: "Trien khai tu GitHub"
permissions:
  contents: read
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false
env:
  DEPLOYMENT_ID: AKfycbxoUmOzXZFN1EXGTfe7SsriHl2zpQfXVndLwqQeZKBmjMS28BYe2GsVS9sdklrcG6P5
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai clasp
        run: npm install -g @google/clasp
      - name: Dang nhap clasp bang secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - name: Day ma len script
        working-directory: script
        run: clasp push --force
      - name: Trien khai vao dung link /exec hien tai
        if: ${{ inputs.trien_khai }}
        working-directory: script
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${{ inputs.ghi_chu }}"
      - name: Xoa chia khoa
        if: always()
        run: rm -f ~/.clasprc.json
