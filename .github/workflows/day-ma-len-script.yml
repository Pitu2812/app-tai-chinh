name: Day ma len Apps Script va trien khai
on:
  workflow_dispatch:
    inputs:
      trien_khai:
        description: "Co trien khai vao link /exec khong? (mac dinh: khong, chi day ma)"
        type: boolean
        default: false
      quay_lai_phien_ban:
        description: "Chi dung khi can lui: so phien ban cu muon tra lai (de trong = khong lui)"
        type: string
        default: ""
      kieu_nhung:
        description: "Cach nhung web vao script: b64 (base64 trong .js), gz (nen gzip + base64 trong tep .html, script khoi nap khoi web moi lan chay) hoac html (tep html)"
        type: choice
        options: [b64, gz, html]
        default: b64
      trien_khai_thu:
        description: "Tao ban trien khai THU rieng (link moi, KHONG dung vao link /exec dang chay)"
        type: boolean
        default: false
      ma_link_thu:
        description: "Tuy chon: ma link THU da co (AKfycb...) de cap nhat dung link do thay vi tao link moi"
        type: string
        default: ""
      ghi_chu:
        description: "Ghi chu cho ban trien khai"
        type: string
        default: "Trien khai tu GitHub"
permissions:
  contents: read
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false
env:
  DEPLOYMENT_ID: AKfycbxoUmOzXZFN1EXGTfe7SsriHl2zpQfXVndLwqQeZKBmjMS28BYe2GsVS9sdklrcG6P5
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cai clasp
        run: npm install -g @google/clasp
      - name: Dang nhap clasp bang secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - name: Gop web va dau moc phien ban vao thu muc script
        if: ${{ inputs.quay_lai_phien_ban == '' }}
        run: |
          if [ "${{ inputs.kieu_nhung }}" = "html" ]; then
            cp web/app-tai-chinh.html script/app_tai_chinh.html
            cp web/phan-cap-thu-rieng.html script/phan_cap_thu_rieng.html
          elif [ "${{ inputs.kieu_nhung }}" = "gz" ]; then
            python3 - <<'PY'
          import base64, gzip
          for key, f in (("app_tai_chinh", "web/app-tai-chinh.html"), ("phan_cap_thu_rieng", "web/phan-cap-thu-rieng.html")):
              b = base64.b64encode(gzip.compress(open(f, "rb").read(), 9)).decode()
              open("script/w64_%s.html" % key, "w").write(b)
              print(key, len(b))
          import glob, os
          for f in sorted(glob.glob("web/parts/*.js")):
              n = os.path.basename(f)[:-3].replace("-", "_")
              b = base64.b64encode(gzip.compress(open(f, "rb").read(), 9)).decode()
              open("script/w64_part_%s.html" % n, "w").write(b)
              print("part", n, len(b))
          PY
          else
            python3 - <<'PY'
          import base64
          out = ["var WEB_PARTS = {};"]
          for key, f in (("app_tai_chinh", "web/app-tai-chinh.html"), ("phan_cap_thu_rieng", "web/phan-cap-thu-rieng.html")):
              b = base64.b64encode(open(f, "rb").read()).decode()
              step = 900000
              out.append("WEB_PARTS[%r] = [" % key + ",".join("'%s'" % b[i:i+step] for i in range(0, len(b), step)) + "];")
          open("script/web-data.js", "w").write("\n".join(out))
          PY
          fi
          echo "var BUILD_TS = $(date +%s%3N);" > script/build-info.js
      - name: Day ma len script
        if: ${{ inputs.quay_lai_phien_ban == '' }}
        working-directory: script
        run: clasp push --force
      - name: Trien khai vao dung link /exec hien tai
        if: ${{ inputs.trien_khai && inputs.quay_lai_phien_ban == '' }}
        working-directory: script
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${{ inputs.ghi_chu }}"
      - name: Tao ban trien khai THU (link rieng, khong dung vao /exec)
        if: ${{ inputs.trien_khai_thu && inputs.quay_lai_phien_ban == '' }}
        working-directory: script
        run: |
          if [ -n "${{ inputs.ma_link_thu }}" ]; then
            clasp deploy --deploymentId "${{ inputs.ma_link_thu }}" --description "THU ${{ inputs.kieu_nhung }}: ${{ inputs.ghi_chu }}" | tee /tmp/dep.txt
          else
            clasp deploy --description "THU ${{ inputs.kieu_nhung }}: ${{ inputs.ghi_chu }}" | tee /tmp/dep.txt
          fi
          id=$(grep -o 'AKfycb[A-Za-z0-9_-]*' /tmp/dep.txt | head -1)
          echo "LINK THU: https://script.google.com/macros/s/$id/exec"
      - name: Lui ve phien ban cu
        if: ${{ inputs.quay_lai_phien_ban != '' }}
        working-directory: script
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "${{ inputs.quay_lai_phien_ban }}" --description "Lui ve phien ban ${{ inputs.quay_lai_phien_ban }}"
      - name: Xoa chia khoa
        if: always()
        run: rm -f ~/.clasprc.json
