name: Lay ma App ty le phan cap ve kho
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @google/clasp
      - name: Dang nhap clasp bang secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
      - name: Keo ma ve app-ty-le/script/
        run: |
          mkdir -p app-ty-le/script
          cd app-ty-le/script
          clasp clone 1U4nQpKZdvCKNQmjOxcVQbdrrCz39O8kqjti7XOvOwaMNrJ4vfvrxGnPu
          ls -la
      - name: Day len nhanh app-ty-le-ban-hien-tai
        run: |
          rm -f ~/.clasprc.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b app-ty-le-ban-hien-tai
          git add app-ty-le/script
          git commit -m "Ma Apps Script App ty le phan cap hien tai (lay tu script.google.com)" || echo "khong co thay doi"
          git push -f origin app-ty-le-ban-hien-tai
