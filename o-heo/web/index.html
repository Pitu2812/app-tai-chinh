<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ổ Heo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
 --bg:#fff7f2;--panel:#ffffff;--soft:#fff0f4;--fg:#3d2b35;--mute:#86697a;--line:#f2dde4;
 --pink:#f492b4;--pink-soft:#fde3ec;--pink-deep:#d9548a;--mint:#86d1b4;--mint-soft:#def4ea;--butter:#f5cf63;--butter-soft:#fdf2d2;
 --accent:#d9548a;--accent-fg:#ffffff;--ok:#1f7a4d;--ok-bg:#e3f3ea;--no:#b3392f;--no-bg:#fbe8e5;--warn:#9a7300;--warn-bg:#fff4d6;
 --pig:#fcd9d6;--pig-dark:#f5b4b8;--pig-nose:#f6b6b6;--pig-belly:#fde8e4;--pig-red:#f37474;--straw:#f6e3a8;--pig-line:#8a5648;--blush:rgba(242,128,140,.45);--sky:#a9d8f2;--shadow:0 6px 18px rgba(217,84,138,.10);
 --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1f181d;--panel:#2a2027;--soft:#33262f;--fg:#f7e9ef;--mute:#c4a8b7;--line:#45343e;
 --pink:#f29bbb;--pink-soft:#4b2b3a;--pink-deep:#f58fb7;--mint:#7ccdae;--mint-soft:#1f3a31;--butter:#e8c55c;--butter-soft:#3e341a;
 --accent:#f28fb6;--accent-fg:#2a1520;--ok:#6fd4a0;--ok-bg:#1d3a2b;--no:#f08b80;--no-bg:#3d2320;--warn:#f0cf6a;--warn-bg:#3a3217;
 --pig:#f6cfcc;--pig-dark:#e9a2a8;--pig-nose:#eeaaaa;--pig-belly:#fbe3df;--pig-red:#ef8080;--straw:#e8d38f;--pig-line:#6e4236;--blush:rgba(236,110,128,.5);--sky:#8ccbec;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1f181d;--panel:#2a2027;--soft:#33262f;--fg:#f7e9ef;--mute:#c4a8b7;--line:#45343e;
 --pink:#f29bbb;--pink-soft:#4b2b3a;--pink-deep:#f58fb7;--mint:#7ccdae;--mint-soft:#1f3a31;--butter:#e8c55c;--butter-soft:#3e341a;
 --accent:#f28fb6;--accent-fg:#2a1520;--ok:#6fd4a0;--ok-bg:#1d3a2b;--no:#f08b80;--no-bg:#3d2320;--warn:#f0cf6a;--warn-bg:#3a3217;
 --pig:#f6cfcc;--pig-dark:#e9a2a8;--pig-nose:#eeaaaa;--pig-belly:#fbe3df;--pig-red:#ef8080;--straw:#e8d38f;--pig-line:#6e4236;--blush:rgba(236,110,128,.5);--sky:#8ccbec;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0}
h2{font-size:21px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hint,.meta{color:var(--mute);font-size:13px}
.btn{font-weight:600;font-size:14px;border:0;border-radius:99px;padding:8px 16px;background:var(--pink-soft);color:var(--pink-deep);cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--mute)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:var(--panel);border-radius:14px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.bdg{display:inline-block;min-width:18px;margin-left:4px;background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;line-height:18px;text-align:center;font-weight:700}
.icon-btn .bdg{position:absolute;top:-4px;right:-4px;margin:0}
.av{flex:none;border-radius:50%;display:grid;place-items:center;overflow:visible}
.err{color:var(--no);font-size:14px;min-height:1em}

/* đăng nhập */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.login{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.login .pig{align-self:center}
.logo{font-family:var(--display);font-size:30px;text-align:center;margin-top:-6px}
.login label{font-size:13px;color:var(--mute)}
.rem{display:flex;gap:8px;align-items:center;font-size:14px!important;color:var(--fg)!important}.rem input{width:18px;height:18px;accent-color:var(--pink-deep)}

/* khung app */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px max(16px,env(safe-area-inset-left,0px)) 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:22px;margin-right:auto}
.tabs{display:flex;gap:4px;padding:8px 16px 0;max-width:1100px;margin:0 auto;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:14px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab[aria-current="page"]{background:var(--pink-soft);color:var(--pink-deep)}
.main{max-width:1100px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.bnav{display:none}
@media (max-width:700px){
 .tabs{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:0;color:var(--mute);padding:4px 2px;min-width:56px;border-radius:12px;cursor:pointer;position:relative}
 .bnav button[aria-current="page"]{color:var(--pink-deep);background:var(--pink-soft)}
 .bnav .ic{font-size:20px;line-height:1.2}
 .bnav .bdg{position:absolute;top:0;right:6px;margin:0}
 .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* nhắn tin */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;height:calc(100vh - 150px);min-height:420px}
.convs{background:var(--panel);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
.conv-acts{display:flex;gap:6px;padding:4px 4px 8px}
.conv{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:transparent;border:0;cursor:pointer;text-align:left;width:100%}
.conv:hover{background:var(--soft)}
.conv[aria-current="true"]{background:var(--pink-soft)}
.conv .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .bdg{margin-left:auto}
.thread{background:var(--panel);border-radius:20px;display:flex;flex-direction:column;min-width:0;min-height:0}
.thread-h{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:8px;align-items:center}
.thread-h .back{display:none}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg .who{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px}
.bubble{padding:8px 12px;border-radius:18px 18px 18px 6px;background:var(--mint-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me .bubble{background:var(--pink-soft);border-radius:18px 18px 6px 18px}
.msg .act{display:flex;gap:6px;align-items:center}
.msg .tm{font-size:11px;color:var(--mute)}
.sysmsg{align-self:center;font-size:12px;color:var(--mute);background:var(--soft);border-radius:99px;padding:3px 12px;text-align:center;max-width:90%}
.filebub{display:flex;gap:10px;align-items:center}
.filebub .fi{font-size:26px}
.filebub b{display:block;overflow-wrap:anywhere}
.daygap{align-self:center;font-size:12px;color:var(--mute)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{min-height:42px;max-height:140px;resize:none;border-radius:20px}
.upl{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pink-deep);border-radius:99px;transition:width .3s}
.empty{background:var(--soft);border-radius:16px;padding:16px;text-align:center;color:var(--mute)}
@media (max-width:700px){
 .chat{grid-template-columns:1fr;height:calc(100vh - 160px)}
 .chat.open .convs{display:none}.chat:not(.open) .thread{display:none}
 .thread-h .back{display:grid}
}

/* hộp thoại */
.modal-bg{position:fixed;inset:0;background:rgba(40,20,30,.38);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:22px;padding:18px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.modal label{font-size:13px;color:var(--mute)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto}
.pick label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);padding:4px}
.pick input{width:18px;height:18px;accent-color:var(--pink-deep)}

/* bảng việc */
.bar-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--panel);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;border:2px dashed transparent}
.col.over{border-color:var(--pink)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;font-size:16px}
.col-h span{font-family:var(--font);font-size:12px;background:var(--soft);border-radius:99px;padding:0 9px;color:var(--mute)}
.tcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;cursor:grab}
.tcard.late{border-color:var(--no);background:var(--no-bg)}
.tcard.done-c .tt{text-decoration:line-through;color:var(--mute)}
.tt{font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.tm{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mv{display:flex;gap:4px;margin-left:auto}
.mv button{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 8px;cursor:pointer;min-height:24px}
.mv button:disabled{opacity:.3;cursor:default}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill.late{background:var(--no-bg);color:var(--no)}.pill.today-p{background:var(--butter-soft);color:var(--warn)}.pill.nod-p{background:var(--pink-soft);color:var(--pink-deep)}

/* hôm nay */
.today{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
@media (max-width:700px){.today{grid-template-columns:1fr}.today .mascot{order:-1}}
.today-list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:16px;padding:10px 12px}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--pink);background:var(--panel);cursor:pointer;display:grid;place-items:center;color:var(--accent-fg);font-weight:700}
.check[aria-checked="true"]{background:var(--pink-deep);border-color:var(--pink-deep)}
.trow .tt{flex:1;min-width:0}
.mascot{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;align-self:start}
.jump{animation:jump .7s ease}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-8deg)}55%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-8px)}}

/* thống kê */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border-radius:16px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mute)}
.stat-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-top:10px}
@media (max-width:700px){.stat-grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:18px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap;align-items:center}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13px}
.hbar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.hbar .tr i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.hbar b{font-variant-numeric:tabular-nums;text-align:right}
.garden{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:4px;font-size:11px;color:var(--mute);align-items:center;justify-items:center}

/* thông báo (PA2) */
.hello{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:16px;padding:8px 14px;margin-bottom:10px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fchips button{font-size:13px;font-weight:600;border:0;border-radius:99px;padding:5px 12px;background:var(--panel);color:var(--mute);cursor:pointer}
.fchips button span{font-variant-numeric:tabular-nums;opacity:.8}.fchips button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.clist{background:var(--panel);border-radius:16px;overflow:hidden}
.crow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.cdot{flex:none;width:10px;height:10px;border-radius:50%}
.ct{flex:1;min-width:0;display:flex;flex-direction:column}.ctt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500}.csub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--pink);background:var(--panel);color:var(--pink-deep);font-weight:700;cursor:pointer}

/* hồ sơ, quản trị */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:8px}
.stack label{font-size:13px;color:var(--mute)}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.avopt{font-size:13px;font-weight:600;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.avopt[aria-pressed="true"]{border-color:var(--pink-deep);background:var(--pink-soft)}
.urow{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px;flex-wrap:wrap}
.urow .who{flex:1 1 180px;min-width:0}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap}
.pwbox{background:var(--butter-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.pwbox b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.04em}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:0 8px;background:var(--soft);color:var(--mute)}
.tag.red{background:var(--no-bg);color:var(--no)}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){.jump{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<iframe name="oheo_sink" id="oheo_sink" src="about:blank" hidden title="khung ẩn để trình duyệt lưu mật khẩu" tabindex="-1"></iframe>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
'use strict';
/* ================= hằng số ================= */
var PRI={hi:{c:'var(--pig-red)',n:'Gấp',m:'đỏ'},imp:{c:'var(--pink)',n:'Quan trọng',m:'hồng'},mid:{c:'var(--butter)',n:'Vừa',m:'vàng'},lo:{c:'var(--mint)',n:'Thong thả',m:'xanh'}};
var PORD={hi:0,imp:1,mid:2,lo:3};
var AVS=[['none','Heo trơn'],['bow','Nơ hồng'],['hat','Nón cói'],['bunny','Tai thỏ'],['bee','Ong vàng'],['scarf','Khăn xanh']];
var AVBG=['var(--pink-soft)','var(--mint-soft)','var(--butter-soft)','var(--soft)'];
var COLS={todo:'Cần làm',doing:'Đang làm',done:'Xong'};
var TEP_LINK=50*1024*1024, TEP_TOI_DA=1024*1024*1024-1;
var TABS=[['chat','Nhắn tin','💬'],['board','Bảng việc','📋'],['today','Hôm nay','☀️'],['stats','Thống kê','📊'],['tb','Thông báo','bell']];

/* ================= trạng thái ================= */
var ST={token:null,toi:null,nguoi:{},ht:[],tin:{},tep:{},viec:[],v:null,sauTin:0,daDoc:{},tab:'chat',conv:null,open:false,boardMode:'mine',rf:'all',het:{},busy:0,uploads:[],adminInfo:null,users:null,mood:null};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var SS={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del:function(k){try{sessionStorage.removeItem(k)}catch(e){}}};
var app=document.getElementById('app');

/* ================= tiện ích ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true},2600)}
function ymd(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fromYmd(n){n=Number(n);return new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100)}
function todayN(){return ymd(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(n){var a=fromYmd(n),b=fromYmd(todayN());return Math.round((a-b)/864e5)}
function fmtDue(n){if(!n)return'không hạn';var x=dayDiff(n);if(x===0)return'hôm nay';if(x===1)return'mai';if(x<0)return'trễ '+(-x)+' ngày';var d=fromYmd(n);return d.getDate()+'/'+(d.getMonth()+1)}

function call(lenh,du_lieu){
 return new Promise(function(res,rej){
  if(!(window.google&&google.script&&google.script.run)){rej({msg:'Trang này phải mở từ link web app.'});return}
  google.script.run.withSuccessHandler(function(s){var o;try{o=JSON.parse(s)}catch(e){rej({msg:'Máy chủ trả lời lạ.'});return}
   if(o.ok)res(o);else{if(o.het_phien&&lenh!=='dangNhap'){logoutLocal(o.msg)}else if(o.phai_doi_mk){ST.toi.doi_mk=true;render()}rej(o)}})
  .withFailureHandler(function(e){rej({msg:'Mạng chập chờn, bạn thử lại nha.',mang:true,goc:e&&e.message})}).api(JSON.stringify({lenh:lenh,token:ST.token,du_lieu:du_lieu||{}}));
 });
}
function fail(e){toast((e&&e.msg)||'Có lỗi, bạn thử lại nha.')}

/* để trình duyệt (Chrome, Safari, Edge) hỏi "Lưu mật khẩu?": sau khi đăng nhập hoặc đổi mật khẩu thành công,
   gửi thật form vào khung ẩn (about:blank, không gửi đi đâu) và báo thêm qua Credential Management nếu có */
function luuMatKhau(f,ten,mk,hoTen){
 try{if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.store)navigator.credentials.store(new PasswordCredential({id:ten,password:mk,name:hoTen||ten})).catch(function(){})}catch(e){}
 try{f.submit()}catch(e){}
}
function loadSession(){ST.token=LS.get('oheo_token')||SS.get('oheo_token');try{ST.toi=JSON.parse(LS.get('oheo_toi')||SS.get('oheo_toi')||'null')}catch(e){ST.toi=null}if(!ST.toi)ST.token=null}
function saveSession(nho){var S=nho?LS:SS;S.set('oheo_token',ST.token);S.set('oheo_toi',JSON.stringify(ST.toi))}
function saveToi(){if(LS.get('oheo_token'))LS.set('oheo_toi',JSON.stringify(ST.toi));else SS.set('oheo_toi',JSON.stringify(ST.toi))}
function logoutLocal(msg){LS.del('oheo_token');LS.del('oheo_toi');SS.del('oheo_token');SS.del('oheo_toi');stopPoll();ST.token=null;ST.toi=null;ST.v=null;ST.tin={};ST.ht=[];ST.viec=[];ST.sauTin=0;ST.nguoi={};ST.daDoc={};ST.users=null;ST.adminInfo=null;closeModal();render();if(msg)toast(msg)}

function bindPwForm(id,onDone){
 var f=document.getElementById(id);if(!f)return;
 f.onsubmit=function(e){e.preventDefault();var p=id.slice(0,2),o=f.querySelector('[id$=-o]').value,n=f.querySelector('[id$=-n]').value,n2=f.querySelector('[id$=-n2]').value,er=f.querySelector('.err');
  if(n!==n2){er.textContent='Hai lần nhập mật khẩu mới chưa giống nhau.';return}
  if(n.length<8){er.textContent='Mật khẩu mới cần ít nhất 8 ký tự.';return}
  var b=f.querySelector('[type=submit]');b.disabled=true;

}

/* ================= đồng bộ ================= */
var pollT=null,polling=false,firstSync=true;
function startApp(){firstSync=true;ST.v=null;ST.sauTin=0;ST.tin={};ST.tep={};poll()}
function stopPoll(){clearTimeout(pollT);pollT=null}
function schedule(ms){clearTimeout(pollT);pollT=setTimeout(poll,ms)}
function poll(){
 if(!ST.token||(ST.toi&&ST.toi.doi_mk))return;
 if(polling)return;polling=true;
 call('dongBo',{v:ST.v,sau_tin:ST.sauTin}).then(function(o){polling=false;merge(o);schedule(document.hidden?20000:4000)})
 .catch(function(e){polling=false;if(ST.token)schedule(e&&e.mang?10000:8000)});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ST.token&&!polling)schedule(200)});
function merge(o){
 var ch={};
 if(o.nguoi){ST.nguoi={};o.nguoi.forEach(function(u){ST.nguoi[u.ten_dn]=u});var me=ST.nguoi[ST.toi.ten_dn];if(me){ST.toi.ho_ten=me.ho_ten;ST.toi.avatar=me.avatar;ST.toi.vai_tro=me.vai_tro;saveToi()}ch.nguoi=1}
 if(o.hoi_thoai){ST.ht=o.hoi_thoai;ch.ht=1}
 if(o.da_doc){o.da_doc.forEach(function(r){ST.daDoc[r[0]]=Math.max(ST.daDoc[r[0]]||0,r[1])})}
 if(o.tep)o.tep.forEach(function(t){ST.tep[t.id]=t});
 if(o.tin&&o.tin.length){o.tin.forEach(addMsg);ch.tin=1}
 if(o.viec){ST.viec=o.viec;ch.viec=1}
 ST.v=o.v;
 if(firstSync){firstSync=false;if(!ST.conv||!ST.ht.some(function(h){return h.id===ST.conv})){var l=sortedConvs()[0];ST.conv=l?l.id:null}render();remindOnOpen();if(ST.toi.vai_tro==='quan_tri')maintenance();return}
 if(ch.nguoi||ch.ht||ch.tin||ch.viec)refresh(ch);
}
function addMsg(t){var a=ST.tin[t.hoi_thoai]||(ST.tin[t.hoi_thoai]=[]);if(a.some(function(x){return x.id===t.id}))return;a.push(t);if(a.length>1&&a[a.length-2].id>t.id)a.sort(function(x,y){return x.id-y.id});if(t.id>ST.sauTin)ST.sauTin=t.id}
function lastMsg(h){var a=ST.tin[h.id];return a&&a.length?a[a.length-1]:null}
function sortedConvs(){return ST.ht.slice().sort(function(a,b){var la=lastMsg(a),lb=lastMsg(b);return(lb?lb.luc:b.tao_luc)-(la?la.luc:a.tao_luc)})}
function unread(h){var a=ST.tin[h.id]||[],r=ST.daDoc[h.id]||0;return a.filter(function(t){return t.id>r&&t.nguoi_gui!==ST.toi.ten_dn}).length}
function totalUnread(){return ST.ht.reduce(function(s,h){return s+(h.id===ST.conv&&ST.tab==='chat'&&ST.open!==false&&!document.hidden?0:unread(h))},0)}
var readT=null;
function markRead(){var h=curConv();if(!h)return;var l=lastMsg(h);if(!l||(ST.daDoc[h.id]||0)>=l.id)return;ST.daDoc[h.id]=l.id;clearTimeout(readT);var id=h.id,tid=l.id;readT=setTimeout(function(){call('daDoc',{hoi_thoai:id,tin_id:tid}).catch(function(){})},800)}

function me(){return ST.toi.ten_dn}

function queueUpload(cid,file){

}

 el.innerHTML=L.map(function(u){var p=Math.floor(u.sent/u.file.size*100),eta='';if(u.st==='đang gửi'&&u.sent>0){var sp=u.sent/((Date.now()-u.t0)/1000),rest=(u.file.size-u.sent)/sp;eta=rest>60?' · còn khoảng '+Math.ceil(rest/60)+' phút':' · còn vài giây'}
  return'<div class="upl"><div style="display:flex;gap:8px;align-items:center"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📎 '+esc(u.file.name)+' · '+fmtSize(u.file.size)+'</span><span class="hint">'+p+'% · '+esc(u.st)+eta+'</span>'+(u.st==='lỗi'?'<button class="btn sm" type="button" data-ur="'+u.id+'">Gửi tiếp</button>':'')+(u.st!=='xong'?'<button class="btn sm ghost" type="button" data-ux="'+u.id+'">Hủy</button>':'')+'</div><div class="bar" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ gửi '+esc(u.file.name)+'"><i style="width:'+p+'%"></i></div></div>'}).join('');
 el.querySelectorAll('[data-ur]').forEach(function(b){b.onclick=function(){var u=ST.uploads.filter(function(x){return String(x.id)===b.dataset.ur})[0];if(u)runUpload(u)}});
 el.querySelectorAll('[data-ux]').forEach(function(b){b.onclick=function(){var u=ST.uploads.filter(function(x){return String(x.id)===b.dataset.ux})[0];if(u){u.huy=true;ST.uploads.splice(ST.uploads.indexOf(u),1);drawUploads();nextUpload()}}});
}

function readPart(file,a,b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=r.result;res(s.slice(s.indexOf(',')+1))};r.onerror=function(){rej({msg:'Không đọc được tệp trên máy.'})};r.readAsDataURL(file.slice(a,b))})}
function runUpload(u){
 u.st='đang gửi';u.t0=Date.now()-1;u.base=u.sent;drawUploads();
 var start=u.ma?call('trangThaiTep',{ma:u.ma}).then(function(o){if(o.xong)return o;u.sent=o.tiep;return null}):call('batDauGuiTep',{hoi_thoai:u.cid,ten:u.file.name,mime:u.file.type||'application/octet-stream',kich_thuoc:u.file.size}).then(function(o){u.ma=o.ma;u.phan=o.phan;return null});
 start.then(function(done){if(done)return done;return step()}).then(function(o){if(u.huy)return;u.st='xong';u.sent=u.file.size;if(o&&o.tep){ST.tep[o.tep.id]=o.tep;addMsg(o.tin)}drawUploads();if(ST.conv===u.cid)drawMsgs(false,true);drawConvs();setTimeout(function(){ST.uploads.splice(ST.uploads.indexOf(u),1);drawUploads()},1500);toast('Đã gửi '+u.file.name);nextUpload()})
 .catch(function(e){if(u.huy)return;u.st='lỗi';drawUploads();fail(e);nextUpload()});
 function step(tries){
  tries=tries||0;if(u.huy)return Promise.resolve(null);
  var a=u.sent,b=Math.min(u.file.size,a+(u.phan||4194304));
  return readPart(u.file,a,b).then(function(b64){return call('guiPhanTep',{ma:u.ma,bat_dau:a,b64:b64})}).then(function(o){if(o.xong)return o;u.sent=o.tiep||b;drawUploadsThrottled();return step(0)})
  .catch(function(e){if(tries<4&&!(e&&e.het_phien)&&!/Phiên gửi tệp đã hết/.test(e&&e.msg||'')){return new Promise(function(r){setTimeout(r,1500*(tries+1))}).then(function(){return call('trangThaiTep',{ma:u.ma})}).then(function(o){if(o.xong)return o;u.sent=o.tiep;return step(tries+1)},function(){return step(tries+1)})}throw e});
 }
}

 next(0).then(function(o){btn.disabled=false;btn.textContent=old;if(!o)return;var blob=new Blob(parts,{type:o.mime||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=o.ten||(t&&t.ten)||'tep';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000)}).catch(function(e){btn.disabled=false;btn.textContent=old;fail(e)});

function viewStats(){
 var M=mine(),done=M.filter(function(t){return t.cot==='done'}).length,doing=M.filter(function(t){return t.cot==='doing'}).length,todo=M.filter(function(t){return t.cot==='todo'}).length,late=M.filter(isLate).length;

 // 7 ngày gần nhất: xong đúng hạn và xong trễ
 var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
 var W=days.map(function(d){var k=ymd(d),L=M.filter(function(t){return t.xong_luc&&ymd(new Date(t.xong_luc))===k});return[['CN','T2','T3','T4','T5','T6','T7'][d.getDay()],L.filter(function(t){return!t.han||t.han>=k}).length,L.filter(function(t){return t.han&&t.han<k}).length]});
 var tot=W.reduce(function(s,w){return s+w[1]+w[2]},0),totL=W.reduce(function(s,w){return s+w[2]},0);
 var max=Math.max(4,Math.ceil(Math.max.apply(null,W.map(function(w){return w[1]+w[2]}))/2)*2);
 var Wd=320,H=170,pl=26,pb=24,pt=14,bw=(Wd-pl-10)/7;
 var s='<svg viewBox="0 0 '+Wd+' '+H+'" width="100%" role="img" aria-label="Số việc xong mỗi ngày trong 7 ngày qua">';
 for(var g=0;g<=max;g+=max/4){var y=pt+(H-pt-pb)*(1-g/max);s+='<line x1="'+pl+'" x2="'+(Wd-6)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--mute)">'+g+'</text>'}
 W.forEach(function(w,i){var x=pl+i*bw+bw*.18,bwi=bw*.64,hd=(H-pt-pb)*w[1]/max,hl=(H-pt-pb)*w[2]/max,base=H-pb;
  if(w[1])s+='<rect x="'+x+'" y="'+(base-hd)+'" width="'+bwi+'" height="'+hd+'" rx="6" fill="var(--mint)"><title>'+w[1]+' xong đúng hạn</title></rect>';
  if(w[2])s+='<rect x="'+x+'" y="'+(base-hd-hl-(w[1]?2:0))+'" width="'+bwi+'" height="'+hl+'" rx="4" fill="var(--pink)"><title>'+w[2]+' xong trễ</title></rect>';
  s+='<text x="'+(x+bwi/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--mute)">'+w[0]+'</text>';
  if(w[1]+w[2])s+='<text x="'+(x+bwi/2)+'" y="'+(base-hd-hl-6)+'" text-anchor="middle" font-size="10" font-weight="600" fill="var(--fg)">'+(w[1]+w[2])+'</text>'});
 s+='</svg>';
 var mo=new Date(),m0=new Date(mo.getFullYear(),mo.getMonth(),1).getTime(),cnt={};
 M.filter(function(t){return t.tao_luc>=m0}).forEach(function(t){cnt[t.nguoi_giao]=(cnt[t.nguoi_giao]||0)+1});
 var arr=Object.keys(cnt).map(function(k){return[k,cnt[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8),mx=arr.length?arr[0][1]:1;
 h+='<div class="stat-grid"><div class="panel"><h3>7 ngày qua: xong '+tot+' việc'+(totL?', trễ '+totL:'')+'</h3><div class="legend"><span><i style="background:var(--mint)"></i>xong đúng hạn</span><span><i style="background:var(--pink)"></i>xong trễ</span></div>'+s+'</div>';
 h+='<div class="panel"><h3>Ai giao việc cho bạn nhiều nhất (tháng '+(mo.getMonth()+1)+')</h3>'+(arr.length?arr.map(function(a){return'<div class="hbar"><span>'+esc(a[0]===me()?'Bạn tự ghi':nameOf(a[0]))+'</span><span class="tr"><i style="width:'+(a[1]/mx*100)+'%"></i></span><b>'+a[1]+'</b></div>'}).join(''):'<p class="hint">Tháng này chưa có việc nào.</p>')+'</div></div>';
 // vườn hoa 5 tuần
 var mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-28);
 var gh='<span></span>'+['T2','T3','T4','T5','T6','T7','CN'].map(function(x){return'<span>'+x+'</span>'}).join(''),tN=todayN();
 for(var wk=0;wk<5;wk++){var d0=new Date(mon);d0.setDate(d0.getDate()+wk*7);gh+='<span>'+d0.getDate()+'/'+(d0.getMonth()+1)+'</span>';for(var dd=0;dd<7;dd++){var dx=new Date(d0);dx.setDate(dx.getDate()+dd);var k=ymd(dx),v=k>tN?-1:M.filter(function(t){return t.xong_luc&&ymd(new Date(t.xong_luc))===k}).length;gh+='<span title="'+(v<0?'chưa tới':v+' việc xong')+'">'+flower(Math.min(v,6))+'</span>'}}
 h+='<div class="panel" style="margin-top:10px"><h3>Vườn hoa 5 tuần: ngày càng nhiều việc xong, hoa càng to</h3><div class="garden">'+gh+'</div><div class="legend"><span>'+flower(0)+' 0 việc</span><span>'+flower(2)+' 2 việc</span><span>'+flower(4)+' 4 việc</span><span>'+flower(6)+' từ 6 việc</span></div></div>';
 h+='<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" type="button" data-act="xuat">⬇ Xuất Excel thống kê việc</button><span class="hint">Tệp cũng được lưu vào thư mục 05 Xuất báo cáo trên Drive.</span></div>';
 return h;
}

 var B=buckets(),list=ST.rf==='late'?B.late:ST.rf==='soon'?B.soon.concat(B.later):ST.rf==='nod'?B.nod:B.late.concat(B.soon,B.nod,B.later);
 var h='<div class="hello">'+pig(moodNow(),44,null,ST.toi.avatar)+'<b>'+(B.M.length?'Còn '+B.M.length+' việc dang dở'+(B.late.length?', '+B.late.length+' việc trễ':''):'Không còn việc dang dở, bạn nghỉ ngơi nha')+'</b></div>';
 h+='<div class="fchips" role="group" aria-label="Lọc việc">'+[['all','Tất cả',B.M.length],['late','Trễ hạn',B.late.length],['soon','Có hạn',B.soon.length+B.later.length],['nod','Không hạn',B.nod.length]].map(function(f){return'<button type="button" data-rf="'+f[0]+'" aria-pressed="'+(ST.rf===f[0])+'">'+f[1]+' <span>'+f[2]+'</span></button>'}).join('')+'</div>';
 h+='<div class="clist">'+(list.length?list.map(function(t){return'<div class="crow"><span class="cdot" style="background:'+PRI[t.uu_tien].c+'" title="Heo '+PRI[t.uu_tien].m+': '+PRI[t.uu_tien].n+'"></span><button type="button" class="ct" data-edit="'+t.id+'" style="border:0;background:none;padding:0;text-align:left;cursor:pointer"><span class="ctt">'+esc(t.tieu_de)+'</span><span class="csub">'+srcOf(t)+'</span></button><span class="pill '+(isLate(t)?'late':t.han?'today-p':'nod-p')+'">'+(t.han?fmtDue(t.han):'nhắc mỗi ngày')+'</span><button type="button" class="ck" data-nd="'+t.id+'" aria-label="Xong: '+esc(t.tieu_de)+'">✓</button></div>'}).join(''):'<div class="empty">Không có việc nào ở mục này.</div>')+'</div>';
 var top={};B.M.forEach(function(t){top[t.nguoi_giao]=(top[t.nguoi_giao]||0)+1});var tk=Object.keys(top).sort(function(a,b){return top[b]-top[a]})[0];
 h+='<div class="tiles" style="margin-top:10px"><div class="tile"><b style="color:var(--no)">'+B.late.length+'</b><span>trễ hạn</span></div><div class="tile"><b>'+(B.soon.length+B.later.length)+'</b><span>có hạn, chưa trễ</span></div><div class="tile"><b>'+B.nod.length+'</b><span>không hạn</span></div><div class="tile"><b>'+B.M.length+'</b><span>cộng dang dở</span></div></div>'+(tk?'<p class="hint" style="margin-top:6px">Giao nhiều nhất: '+esc(tk===me()?'Bạn tự ghi':nameOf(tk))+' ('+top[tk]+' việc)</p>':'');
 return h;
}
BIND.tb=function(m){
 m.querySelectorAll('[data-rf]').forEach(function(b){b.onclick=function(){ST.rf=b.dataset.rf;renderMain()}});
 m.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){dlgEditTask(findTask(b.dataset.edit))}});
 m.querySelectorAll('[data-nd]').forEach(function(b){b.onclick=function(){moveTask(findTask(b.dataset.nd),'done',function(){toast('Giỏi quá, xong thêm 1 việc rồi!')})}});
};
function remindOnOpen(){var B=buckets(),k='oheo_nhac_'+me();if(!B.badge||LS.get(k)===String(todayN()))return;LS.set(k,String(todayN()));setTimeout(function(){toast('Bạn ơi, còn '+B.M.length+' việc dang dở'+(B.late.length?', '+B.late.length+' việc trễ hạn':'')+'. Xem ở tab Thông báo nha.')},600)}

/* ================= hồ sơ ================= */
function viewMe(){
 var t=LS.get('oheo_theme')||'auto';
 return '<div class="two"><section class="card stack"><h2>'+esc(ST.toi.ho_ten)+'</h2><p class="hint">Tên đăng nhập: '+esc(me())+(ST.toi.vai_tro==='quan_tri'?' · quản trị':'')+'</p><label>Avatar heo của bạn</label><div class="avpick">'+AVS.map(function(a){return'<button type="button" class="avopt" data-av="'+a[0]+'" aria-pressed="'+(a[0]===ST.toi.avatar)+'">'+pig('happy',54,null,a[0])+'<span>'+a[1]+'</span></button>'}).join('')+'</div>'
 +'<label for="th">Giao diện</label><div class="seg" role="group" id="th">'+[['auto','Theo máy'],['light','Sáng'],['dark','Tối']].map(function(x){return'<button type="button" data-th="'+x[0]+'" aria-pressed="'+(t===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
 +'<button class="btn" type="button" data-act="logout" style="align-self:flex-start;margin-top:8px">Đăng xuất</button></section>'
 +'<form class="card stack" id="mp-f" method="post" action="about:blank" target="oheo_sink"><input type="text" name="username" autocomplete="username" value="'+esc(me())+'" hidden readonly><h2>Đổi mật khẩu</h2><label for="mp-o">Mật khẩu hiện tại</label><input type="password" id="mp-o" name="current-password" autocomplete="current-password" required><label for="mp-n">Mật khẩu mới (ít nhất 8 ký tự)</label><input type="password" id="mp-n" name="new-password" autocomplete="new-password" minlength="8" required><label for="mp-n2">Nhập lại mật khẩu mới</label><input type="password" id="mp-n2" autocomplete="new-password" minlength="8" required><button class="btn solid" type="submit" style="align-self:flex-start">Lưu mật khẩu</button><div class="err" role="alert"></div><p class="hint">Đổi mật khẩu xong, các máy khác đang đăng nhập tài khoản này sẽ phải đăng nhập lại.</p></form></div>';
}
BIND.me=function(m){
 m.querySelectorAll('[data-av]').forEach(function(b){b.onclick=function(){var old=ST.toi.avatar;ST.toi.avatar=b.dataset.av;saveToi();render();call('doiAvatar',{avatar:b.dataset.av}).then(function(){toast('Đã đổi avatar')}).catch(function(e){ST.toi.avatar=old;saveToi();render();fail(e)})}});
 m.querySelectorAll('[data-th]').forEach(function(b){b.onclick=function(){if(b.dataset.th==='auto')LS.del('oheo_theme');else LS.set('oheo_theme',b.dataset.th);applyTheme();render()}});
 m.querySelector('[data-act=logout]').onclick=doLogout;
 bindPwForm('mp-f',function(){toast('Đã đổi mật khẩu')});
};
function doLogout(){var t=ST.token;call('dangXuat',{}).catch(function(){});logoutLocal('Đã đăng xuất')}

/* ================= quản trị ================= */
function maintenance(){var k='oheo_baotri';if(SS.get(k))return;SS.set(k,'1');call('baoTri',{}).then(function(o){ST.adminInfo=o;if(o.cat_tin)toast('Đã cất '+o.cat_tin+' tin cũ sang thư mục lưu trữ');if(ST.tab==='admin')renderMain()}).catch(function(){})}
function viewAdmin(){
 if(!ST.users){call('dsNguoiDung',{}).then(function(o){ST.users=o.nguoi;if(ST.tab==='admin')renderMain()}).catch(fail);return'<p class="hint">Đang tải danh sách...</p>'}
 var h='<div class="two"><section class="card stack"><h2>Tài khoản ('+ST.users.length+')</h2>'+ST.users.map(function(u){return'<div class="urow">'+av(u.ten_dn,34)+'<div class="who"><b>'+esc(u.ho_ten)+'</b><div class="hint">'+esc(u.ten_dn)+' · '+(u.vai_tro==='quan_tri'?'quản trị':'thành viên')+(u.khoa?' <span class="tag red">đã khóa</span>':'')+(u.doi_mk?' <span class="tag">chưa đổi mật khẩu</span>':'')+(u.dang_nhap_cuoi?' · vào lần cuối '+fmtTime(u.dang_nhap_cuoi):'')+'</div></div><div class="acts"><button class="btn sm" type="button" data-rn="'+esc(u.ten_dn)+'">Đổi tên</button><button class="btn sm" type="button" data-rs="'+esc(u.ten_dn)+'">Đặt lại mật khẩu</button>'+(u.ten_dn!==me()?'<button class="btn sm" type="button" data-lk="'+esc(u.ten_dn)+'" data-on="'+(u.khoa?0:1)+'">'+(u.khoa?'Mở khóa':'Khóa')+'</button>':'')+'</div></div>'}).join('')+'<div id="pw-out"></div></section>';
 h+='<div class="stack"><form class="card stack" id="nu-f"><h2>Cấp tài khoản mới</h2><label for="nu-n">Họ tên</label><input type="text" id="nu-n" maxlength="60" placeholder="Ví dụ: Nguyễn Minh Thư" required><label for="nu-u">Tên đăng nhập (chữ thường không dấu)</label><input type="text" id="nu-u" maxlength="30" placeholder="Ví dụ: thu.nm" autocapitalize="none" spellcheck="false" required><button class="btn solid" type="submit" style="align-self:flex-start">Cấp tài khoản</button><div class="err" role="alert"></div><div id="nu-out"></div></form>';
 var a=ST.adminInfo;
 h+='<section class="card stack"><h2>Tình trạng dữ liệu</h2>'+(a?('<p>Google Sheet: '+(a.o_sheet?Math.round(a.o_sheet/1e5)/100+' triệu ô / 10 triệu ô':'?')+'</p><p>Drive: '+(a.drive_tong?fmtSize(a.drive_dung)+' / '+fmtSize(a.drive_tong)+(a.drive_dung/a.drive_tong>.8?' <span class="tag red">gần đầy, nên nâng cấp gói hoặc dời tệp cũ</span>':''):'?')+'</p><p class="hint">Tin cũ hơn tháng trước tự cất sang "02 Lưu trữ tin nhắn" mỗi tháng; Google Sheet tự sao lưu mỗi 7 ngày vào "04 Sao lưu" (giữ 8 bản), khi quản trị mở app.'+(a.sao_luu?' Vừa sao lưu xong.':'')+'</p>'):'<p class="hint">Đang kiểm tra...</p>')+'</section></div></div>';
 return h;
}
BIND.admin=function(m){
 if(!ST.users)return;
 function showPw(o,who){m.querySelector('#pw-out').innerHTML='<div class="pwbox">Mật khẩu tạm của '+esc(who)+': <b>'+esc(o.mat_khau_tam)+'</b><br><span class="hint">Bạn gửi riêng cho người đó (tên đăng nhập '+esc(o.ten_dn)+'). Lần đăng nhập tới họ phải đổi mật khẩu. Mật khẩu này chỉ hiện một lần.</span></div>';m.querySelector('#pw-out').scrollIntoView({block:'nearest'})}
 function reload(){call('dsNguoiDung',{}).then(function(o){ST.users=o.nguoi;var keep=m.querySelector('#pw-out').innerHTML;renderMain();var p=document.getElementById('pw-out');if(p)p.innerHTML=keep})}
 m.querySelectorAll('[data-rs]').forEach(function(b){b.onclick=function(){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Bấm lần nữa để đặt lại';return}b.disabled=true;var u=ST.users.filter(function(x){return x.ten_dn===b.dataset.rs})[0];call('datLaiMatKhau',{ten_dn:b.dataset.rs}).then(function(o){showPw(o,u.ho_ten);if(b.dataset.rs===me()){toast('Bạn vừa đặt lại mật khẩu của chính mình, bạn đăng nhập lại nha');setTimeout(function(){logoutLocal()},4000)}else reload()}).catch(function(e){b.disabled=false;fail(e)})}});
 m.querySelectorAll('[data-lk]').forEach(function(b){b.onclick=function(){b.disabled=true;call('khoaTaiKhoan',{ten_dn:b.dataset.lk,khoa:b.dataset.on==='1'}).then(function(){toast(b.dataset.on==='1'?'Đã khóa':'Đã mở khóa');reload()}).catch(function(e){b.disabled=false;fail(e)})}});
 m.querySelectorAll('[data-rn]').forEach(function(b){b.onclick=function(){var u=ST.users.filter(function(x){return x.ten_dn===b.dataset.rn})[0];openModal('<h3>Đổi tên hiển thị</h3><label for="rn-n">Họ tên</label><input type="text" id="rn-n" maxlength="60" value="'+esc(u.ho_ten)+'"><div class="row"><button class="btn" type="button" data-x>Thôi</button><button class="btn solid" type="button" data-ok>Lưu</button></div>',function(md){md.querySelector('[data-x]').onclick=closeModal;md.querySelector('[data-ok]').onclick=function(){var x=this;x.disabled=true;call('doiTen',{ten_dn:u.ten_dn,ho_ten:md.querySelector('#rn-n').value}).then(function(){closeModal();toast('Đã đổi tên');reload();schedule(500)}).catch(function(e){x.disabled=false;fail(e)})}})}});
 var f=m.querySelector('#nu-f');f.onsubmit=function(e){e.preventDefault();var b=f.querySelector('[type=submit]'),er=f.querySelector('.err'),n=f.querySelector('#nu-n').value.trim(),u=f.querySelector('#nu-u').value.trim().toLowerCase();b.disabled=true;er.textContent='';
  call('capTaiKhoan',{ho_ten:n,ten_dn:u}).then(function(o){b.disabled=false;f.reset();ST.users.push({ten_dn:o.ten_dn,ho_ten:n,vai_tro:'thanh_vien',doi_mk:true});renderMain();showPw(o,n);schedule(500)}).catch(function(x){b.disabled=false;er.textContent=x.msg})};
};

/* ================= khởi động ================= */
loadSession();
render();
if(ST.token&&ST.toi&&!ST.toi.doi_mk)startApp();
})();
</script>
