<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ổ Heo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
 --bg:#fff7f2;--panel:#ffffff;--soft:#fff0f4;--fg:#3d2b35;--mute:#86697a;--line:#f2dde4;
 --pink:#f492b4;--pink-soft:#fde3ec;--pink-deep:#d9548a;--mint:#86d1b4;--mint-soft:#def4ea;--butter:#f5cf63;--butter-soft:#fdf2d2;
 --accent:#d9548a;--accent-fg:#ffffff;--ok:#1f7a4d;--ok-bg:#e3f3ea;--no:#b3392f;--no-bg:#fbe8e5;--warn:#9a7300;--warn-bg:#fff4d6;
 --pig:#fcd9d6;--pig-dark:#f5b4b8;--pig-nose:#f6b6b6;--pig-belly:#fde8e4;--pig-red:#f37474;--straw:#f6e3a8;--pig-line:#8a5648;--blush:rgba(242,128,140,.45);--sky:#a9d8f2;--shadow:0 6px 18px rgba(217,84,138,.10);
 --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;--font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#1f181d;--panel:#2a2027;--soft:#33262f;--fg:#f7e9ef;--mute:#c4a8b7;--line:#45343e;
 --pink:#f29bbb;--pink-soft:#4b2b3a;--pink-deep:#f58fb7;--mint:#7ccdae;--mint-soft:#1f3a31;--butter:#e8c55c;--butter-soft:#3e341a;
 --accent:#f28fb6;--accent-fg:#2a1520;--ok:#6fd4a0;--ok-bg:#1d3a2b;--no:#f08b80;--no-bg:#3d2320;--warn:#f0cf6a;--warn-bg:#3a3217;
 --pig:#f6cfcc;--pig-dark:#e9a2a8;--pig-nose:#eeaaaa;--pig-belly:#fbe3df;--pig-red:#ef8080;--straw:#e8d38f;--pig-line:#6e4236;--blush:rgba(236,110,128,.5);--sky:#8ccbec;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#1f181d;--panel:#2a2027;--soft:#33262f;--fg:#f7e9ef;--mute:#c4a8b7;--line:#45343e;
 --pink:#f29bbb;--pink-soft:#4b2b3a;--pink-deep:#f58fb7;--mint:#7ccdae;--mint-soft:#1f3a31;--butter:#e8c55c;--butter-soft:#3e341a;
 --accent:#f28fb6;--accent-fg:#2a1520;--ok:#6fd4a0;--ok-bg:#1d3a2b;--no:#f08b80;--no-bg:#3d2320;--warn:#f0cf6a;--warn-bg:#3a3217;
 --pig:#f6cfcc;--pig-dark:#e9a2a8;--pig-nose:#eeaaaa;--pig-belly:#fbe3df;--pig-red:#ef8080;--straw:#e8d38f;--pig-line:#6e4236;--blush:rgba(236,110,128,.5);--sky:#8ccbec;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0}
h2{font-size:21px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hint,.meta{color:var(--mute);font-size:13px}
.btn{font-weight:600;font-size:14px;border:0;border-radius:99px;padding:8px 16px;background:var(--pink-soft);color:var(--pink-deep);cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--mute)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:var(--panel);border-radius:14px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.bdg{display:inline-block;min-width:18px;margin-left:4px;background:var(--no);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;line-height:18px;text-align:center;font-weight:700}
.icon-btn .bdg{position:absolute;top:-4px;right:-4px;margin:0}
.av{flex:none;border-radius:50%;display:grid;place-items:center;overflow:visible;position:relative}
.pres{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel);background:#b9aab2}
.pres.on{background:#2fbf71}
.seen{font-size:12px;color:var(--mute);font-weight:400}.seen.on{color:var(--ok);font-weight:600}
.err{color:var(--no);font-size:14px;min-height:1em}

/* đăng nhập */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.login{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.login .pig{align-self:center}
.logo{font-family:var(--display);font-size:30px;text-align:center;margin-top:-6px}
.login label{font-size:13px;color:var(--mute)}
.rem{display:flex;gap:8px;align-items:center;font-size:14px!important;color:var(--fg)!important}.rem input{width:18px;height:18px;accent-color:var(--pink-deep)}

/* khung app */
.top{background:var(--bg);padding:10px max(16px,env(safe-area-inset-left,0px)) 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:22px;margin-right:auto}
.tabs{display:flex;gap:4px;padding:8px 16px 0;max-width:1100px;margin:0 auto;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:14px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab[aria-current="page"]{background:var(--pink-soft);color:var(--pink-deep)}
.main{max-width:1100px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.bnav{display:none}
@media (max-width:700px){
 .tabs{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:0;color:var(--mute);padding:4px 2px;min-width:56px;border-radius:12px;cursor:pointer;position:relative}
 .bnav button[aria-current="page"]{color:var(--pink-deep);background:var(--pink-soft)}
 .bnav .ic{font-size:20px;line-height:1.2}
 .bnav .bdg{position:absolute;top:0;right:6px;margin:0}
 .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* nhắn tin */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;height:calc(100vh - 150px);min-height:420px}
.convs{background:var(--panel);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
.conv-acts{display:flex;gap:6px;padding:4px 4px 8px}
.conv{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:transparent;border:0;cursor:pointer;text-align:left;width:100%}
.conv:hover{background:var(--soft)}
.conv[aria-current="true"]{background:var(--pink-soft)}
.conv .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .bdg{margin-left:auto}
.thread{background:var(--panel);border-radius:20px;display:flex;flex-direction:column;min-width:0;min-height:0}
.thread-h{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:8px;align-items:center}
.thread-h .back{display:none}
.msgs{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg .who{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px}
.bubble{padding:8px 12px;border-radius:18px 18px 18px 6px;background:var(--mint-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.gone,.msg.me .bubble.gone{background:transparent;border:1px dashed var(--line);color:var(--mute);font-style:italic}
.optlist{display:flex;flex-direction:column;gap:8px}.optlist .btn{justify-content:flex-start;text-align:left}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me .bubble{background:var(--pink-soft);border-radius:18px 18px 6px 18px}
.msg .act{display:flex;gap:6px;align-items:center}
.imgbub{display:block;padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--soft);cursor:zoom-in;min-width:120px;min-height:80px;max-width:min(300px,68vw)}
.imgbub img{display:block;max-width:100%;max-height:300px;object-fit:contain}
.imgph{display:grid;place-items:center;width:200px;max-width:100%;height:140px;font-size:13px;color:var(--mute)}
.imgcap{font-size:12px;color:var(--mute)}
.modal.lbx{max-width:min(96vw,1100px)}.lbx .lbimg{display:grid;place-items:center;background:var(--soft);border-radius:14px;min-height:200px;overflow:auto;max-height:calc(100vh - 170px)}
.lbx .lbimg img{max-width:100%;max-height:calc(100vh - 180px);object-fit:contain}
.thread.drop{outline:3px dashed var(--pink);outline-offset:-6px}
.rcpt{font-size:12px;color:var(--mute);margin-top:-2px}.rcpt.seen{color:var(--ok);font-weight:600}
.typing .bubble{align-self:flex-start;display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing .bubble i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:tdot 1.2s infinite}
.typing .bubble i:nth-child(2){animation-delay:.2s}.typing .bubble i:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.typing .bubble i{animation:none;opacity:.7}}
.msg .tm{font-size:11px;color:var(--mute)}
.sysmsg{align-self:center;font-size:12px;color:var(--mute);background:var(--soft);border-radius:99px;padding:3px 12px;text-align:center;max-width:90%}
.filebub{display:flex;gap:10px;align-items:center}
.filebub .fi{font-size:26px}
.filebub b{display:block;overflow-wrap:anywhere}
.daygap{align-self:center;font-size:12px;color:var(--mute)}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{min-height:42px;max-height:140px;resize:none;border-radius:20px}
.upl{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pink-deep);border-radius:99px;transition:width .3s}
.empty{background:var(--soft);border-radius:16px;padding:16px;text-align:center;color:var(--mute)}
@media (max-width:700px){
 .chat{grid-template-columns:1fr;height:calc(100vh - 160px)}
 .chat.open .convs{display:none}.chat:not(.open) .thread{display:none}
 .thread-h .back{display:grid}
}

/* hộp thoại */
.modal-bg{position:fixed;inset:0;background:rgba(40,20,30,.38);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:22px;padding:18px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.modal label{font-size:13px;color:var(--mute)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto}
.pick label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);padding:4px}
.pick input{width:18px;height:18px;accent-color:var(--pink-deep)}

/* bảng việc */
.bar-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:var(--panel);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;border:2px dashed transparent}
.col.over{border-color:var(--pink)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;font-size:16px}
.col-h span{font-family:var(--font);font-size:12px;background:var(--soft);border-radius:99px;padding:0 9px;color:var(--mute)}
.tcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;cursor:grab}
.tcard.late{border-color:var(--no);background:var(--no-bg)}
.tcard.done-c .tt{text-decoration:line-through;color:var(--mute)}
.tt{font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.tm{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tcard.open{border-color:var(--pink);cursor:default}.spn{font-weight:600;color:var(--pink-deep)}
.tdet{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;font-size:13px}
.tdet .upl{border-top:0;padding:4px 0}
.tl{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--pink);padding-left:8px}
.tlr{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.tlr>span:nth-child(2){flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.spact{display:flex;gap:4px;margin-top:4px}
.lan{flex:none;font-weight:700;color:var(--pink-deep);font-size:12px;background:var(--pink-soft);border-radius:99px;padding:0 8px}
.tdet .row{justify-content:flex-start;flex-wrap:wrap;gap:6px;margin:0}
.lklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lkcard{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--fg);text-decoration:none;box-shadow:var(--shadow)}
.lkw{position:relative;min-width:0}.lkw .lkcard{height:100%;padding-right:46px}.lkm{position:absolute;top:10px;right:10px}
.lkcard b{overflow-wrap:anywhere}.lktag{display:table;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;margin-top:3px}.lktag.all{background:var(--mint-soft,#def4ea);color:var(--ok)}.lktag.me{background:var(--pink-soft);color:var(--pink-deep)}
.lkadd{display:flex;gap:8px;align-items:center;justify-content:center;border:2px dashed var(--pink);border-radius:18px;padding:14px 16px;background:transparent;color:var(--pink-deep);font:inherit;font-weight:700;font-size:15px;cursor:pointer;min-height:72px}.lkadd:hover{background:var(--pink-soft)}
.icp{display:flex;gap:6px;flex-wrap:wrap}.icp button{font-size:20px;line-height:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:5px 7px;cursor:pointer}.icp button[aria-pressed=true]{border-color:var(--pink-deep);background:var(--pink-soft)}
.lkcard:hover{border-color:var(--pink)}.lkcard .ic{font-size:30px;line-height:1}.lkcard b{display:block;font-family:var(--display);font-size:18px}.lkcard .go{margin-left:auto;color:var(--pink-deep);font-weight:700}
.lkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.lkbar .hello{flex:1 1 320px;margin:0;min-width:0}
.lkfind{flex:1 1 200px;max-width:320px;font:inherit;font-size:14px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;flex:none}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--mute);border-radius:99px;padding:5px 12px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--pink-soft);color:var(--pink-deep)}
.lksec{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mute);margin:14px 2px 6px}
.lkrows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lkr{position:relative;display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}.lkr:last-child{border-bottom:0}
.lkra{display:flex;gap:10px;align-items:center;flex:1;min-width:0;color:var(--fg);text-decoration:none}.lkra:hover b{color:var(--pink-deep)}
.lkra .ic{font-size:20px;flex:none}.lkra .tx,.lkcard .tx{min-width:0;display:flex;flex-direction:column}
.lkra b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lkra .hint{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkact{display:flex;gap:4px;align-items:center;flex:none}.lkw>.lkact{position:absolute;bottom:8px;right:10px}
.lkw .lkcard{padding:14px 16px 42px}
.lkgrip{cursor:grab;color:var(--mute);font-size:16px;user-select:none;padding:0 2px}
.drag-over{outline:2px dashed var(--pink-deep);outline-offset:-2px}.dang-keo{opacity:.5}
.lkmenu{position:absolute;top:calc(100% - 6px);right:10px;z-index:5;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);min-width:150px}
.lkmenu button{font:inherit;font-size:14px;text-align:left;border:0;background:none;color:var(--fg);padding:7px 10px;border-radius:8px;cursor:pointer}.lkmenu button:hover,.lkmenu button:focus-visible{background:var(--soft)}
.lkadd{margin-top:14px;width:100%}
@media (max-width:560px){.lkgrip{display:none}.lkr{padding:8px 10px}.lkfind{max-width:none}}
@media (hover:none){.lkgrip{display:none}}
.lkr[hidden],.lkw[hidden],.lksecw[hidden],.lkrong[hidden],.lkkhong[hidden]{display:none!important}
.mv{display:flex;gap:4px;margin-left:auto}
.mv button{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 8px;cursor:pointer;min-height:24px}
.mv button:disabled{opacity:.3;cursor:default}
.pill{font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill.late{background:var(--no-bg);color:var(--no)}.pill.today-p{background:var(--butter-soft);color:var(--warn)}.pill.nod-p{background:var(--pink-soft);color:var(--pink-deep)}

/* hôm nay */
.today{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
@media (max-width:700px){.today{grid-template-columns:1fr}.today .mascot{order:-1}}
.today-list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:16px;padding:10px 12px}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--pink);background:var(--panel);cursor:pointer;display:grid;place-items:center;color:var(--accent-fg);font-weight:700}
.check[aria-checked="true"]{background:var(--pink-deep);border-color:var(--pink-deep)}
.trow .tt{flex:1;min-width:0}
.mascot{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;align-self:start}
.jump{animation:jump .7s ease}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-22px) rotate(-8deg)}55%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-8px)}}

/* thống kê */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border-radius:16px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}

/* online: máy chủ trả giờ hoạt động cuối của từng người; dưới 50 giây là đang online */
function lastSeen(t){if(t===ST.toi.ten_dn)return Date.now();var x=ST.online&&ST.online[t];return x?x+(ST.skew||0):0}
function isOn(t){var x=lastSeen(t);return!!x&&Date.now()-x<50000}
function seenText(t){var u=ST.nguoi[t];if(u&&u.da_xoa)return'đã xóa';if(u&&u.khoa)return'đã khóa';var x=lastSeen(t);if(!x)return'chưa vào app';var m=Math.floor((Date.now()-x)/60000);if(Date.now()-x<50000)return'đang online';if(m<1)return'vừa hoạt động';if(m<60)return'hoạt động '+m+' phút trước';var h=Math.floor(m/60);if(h<24)return'hoạt động '+h+' giờ trước';var d=Math.floor(h/24);return d===1?'hoạt động hôm qua':'hoạt động '+d+' ngày trước'}
function seenSpan(t){return'<span class="seen'+(isOn(t)?' on':'')+'" data-seen="'+esc(t)+'">'+seenText(t)+'</span>'}
function groupSeen(h){var n=h.thanh_vien.filter(function(t){return t!==ST.toi.ten_dn&&isOn(t)}).length;return n?n+' người khác đang online':'chưa ai khác online'}

function call(lenh,du_lieu){
 return new Promise(function(res,rej){
  if(!(window.google&&google.script&&google.script.run)){rej({msg:'Trang này phải mở từ link web app.'});return}
  google.script.run.withSuccessHandler(function(s){var o;try{o=JSON.parse(s)}catch(e){rej({msg:'Máy chủ trả lời lạ.'});return}
   if(o.ok)res(o);else{if(o.het_phien&&lenh!=='dangNhap'){logoutLocal(o.msg)}else if(o.phai_doi_mk){ST.toi.doi_mk=true;render()}rej(o)}})
  .withFailureHandler(function(e){rej({msg:'Mạng chập chờn, bạn thử lại nha.',mang:true,goc:e&&e.message})}).api(JSON.stringify({lenh:lenh,token:ST.token,du_lieu:du_lieu||{}}));
 });
}
function fail(e){toast((e&&e.msg)||'Có lỗi, bạn thử lại nha.')}

}

function napLk(){if(ST.lkDang)return;ST.lkDang=1;ST.lkLoi='';call('dsLienKet',{}).then(function(o){ST.lkDang=0;ST.lk=o.lien_ket;ST.lkChung=o.chia_se;if(ST.tab==='lk')renderMain()}).catch(function(e){ST.lkDang=0;ST.lkLoi=(e&&e.msg)||'Chưa tải được liên kết.';if(ST.tab==='lk')renderMain()})}
function dlgLk(l){var ic=l&&l.bieu_tuong||'🔗';
 openModal('<h3>'+(l?'Sửa liên kết':'＋ Thêm liên kết')+'</h3><form id="lk-f" novalidate><label for="lk-t">Tiêu đề</label><input type="text" id="lk-t" maxlength="60" placeholder="Ví dụ: Cổng dịch vụ công" value="'+esc(l?l.tieu_de:'')+'"><label for="lk-u">Đường dẫn</label><input type="text" id="lk-u" inputmode="url" autocomplete="url" spellcheck="false" placeholder="Dán link vào đây, ví dụ dichvucong.gov.vn" value="'+esc(l?l.duong_dan:'')+'"><label>Biểu tượng</label><div class="icp" role="group" aria-label="Biểu tượng">'+LK_IC.map(function(c){return'<button type="button" data-ic="'+c+'" aria-pressed="'+(c===ic)+'">'+c+'</button>'}).join('')+'</div><label for="lk-g">Ghi chú ngắn (không bắt buộc)</label><input type="text" id="lk-g" maxlength="80" placeholder="Ví dụ: Nộp hồ sơ trực tuyến" value="'+esc(l?l.ghi_chu:'')+'">'
  +(ST.lkChung?'<label class="tgnew" style="color:var(--fg)"><input type="checkbox" id="lk-c"'+(l&&l.chung?' checked':'')+'> <span>Hiện cho mọi người<br><span class="hint">Không tick thì chỉ bạn thấy.</span></span></label>':'')
  +'<div class="err" id="lk-e"></div><div class="row">'+(l?'<button class="btn ghost" type="button" data-del style="color:var(--no);margin-right:auto">🗑 Xóa</button>':'')+'<button class="btn" type="button" data-x>Hủy</button><button class="btn solid" type="submit">Lưu</button></div></form>',function(m){
  var f=m.querySelector('#lk-f'),er=m.querySelector('#lk-e');
  m.querySelector('[data-x]').onclick=closeModal;
  m.querySelectorAll('[data-ic]').forEach(function(b){b.onclick=function(){ic=b.dataset.ic;m.querySelectorAll('[data-ic]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
  var xong=function(o,msg){ST.lk=o.lien_ket;ST.lkChung=o.chia_se;closeModal();if(ST.tab==='lk')renderMain();toast(msg)};
  var del=m.querySelector('[data-del]');if(del)del.onclick=function(){if(del.dataset.ok!=='1'){del.dataset.ok='1';del.textContent='Bấm lần nữa để xóa hẳn';return}del.disabled=true;call('xoaLienKet',{id:l.id}).then(function(o){xong(o,'Đã xóa liên kết '+l.tieu_de)}).catch(function(e){del.disabled=false;er.textContent=(e&&e.msg)||'Chưa xóa được, bạn thử lại nha.'})};
  f.onsubmit=function(ev){ev.preventDefault();var t=m.querySelector('#lk-t').value.trim(),u=m.querySelector('#lk-u').value.trim();
   if(!t){er.textContent='Bạn ghi tiêu đề nha.';return}if(!u){er.textContent='Bạn dán đường dẫn nha.';return}
   var b=f.querySelector('[type=submit]');b.disabled=true;var c=m.querySelector('#lk-c');
   call('luuLienKet',{id:l?l.id:'',tieu_de:t,duong_dan:u,ghi_chu:m.querySelector('#lk-g').value,bieu_tuong:ic,chung:c?c.checked:undefined}).then(function(o){xong(o,'Đã lưu liên kết '+t)}).catch(function(e){b.disabled=false;er.textContent=(e&&e.msg)||'Chưa lưu được, bạn thử lại nha.'})};
  setTimeout(function(){var i=m.querySelector('#lk-t');if(i)i.focus()},50);
 })}

/* App tài chính: xin vé dùng một lần rồi mở; mở cửa sổ ngay lúc bấm để trình duyệt không chặn */
BIND.lk=function(m){if(ST.lk===undefined&&!ST.lkLoi)napLk();bindLk12(m);var re=m.querySelector('[data-lkre]');if(re)re.onclick=function(){ST.lkLoi='';renderMain();napLk()};var ad=m.querySelector('[data-lkadd]');if(ad)ad.onclick=function(){dlgLk(null)};m.querySelectorAll('[data-lke]').forEach(function(b){b.onclick=function(){dlgLk((ST.lk||[]).filter(function(x){return x.id===+b.dataset.lke})[0])}});
 m.querySelectorAll('[data-lk]').forEach(function(a){a.onclick=function(e){e.preventDefault();var w=null;try{w=window.open('','_blank')}catch(x){}
 if(w){try{w.opener=null;w.document.title='Đang mở...';w.document.body.innerHTML='<p style="font:16px system-ui;padding:24px">Đang mở App tài chính...</p>'}catch(x){}}
 call('veAppTaiChinh',{}).then(function(o){if(w&&!w.closed){w.location.href=o.url}else openModal('<h3>Mở App tài chính</h3><p>Trình duyệt vừa chặn mở tab mới. Bạn bấm nút dưới đây nha (link dùng được trong 2 phút).</p><div class="row"><button class="btn" type="button" data-x>Hủy</button><a class="btn solid" href="'+esc(o.url)+'" target="_blank" rel="noopener" data-go>Mở App tài chính</a></div>',function(md){md.querySelector('[data-x]').onclick=closeModal;md.querySelector('[data-go]').onclick=function(){setTimeout(closeModal,300)}})})
 .catch(function(x){if(w&&!w.closed)w.location.href=a.href;fail(x)})}})};

/* phân quyền một tài khoản: chọn nhanh mẫu rồi bật tắt từng quyền */
function dlgQuyen(u,done){
 var q=(u.quyen||[]).slice();
 function body(){var k=mauCua(q);return'<h3>Phân quyền: '+esc(u.ho_ten)+'</h3><p class="hint">'+esc(u.ten_dn)+'. Nút nào tắt sẽ ẩn trên màn người này, máy chủ cũng chặn. Ai cũng luôn được đọc, trả lời trong cuộc trò chuyện đã có, nhận việc, tự ghi việc cho mình, đổi mật khẩu, avatar.</p><div class="row" role="group" aria-label="Chọn nhanh mẫu quyền" style="justify-content:flex-start;flex-wrap:wrap">'+['du','co_ban','chi_nhan'].map(function(x){return'<button class="btn sm'+(k===x?' solid':'')+'" type="button" data-mau="'+x+'" aria-pressed="'+(k===x)+'">'+MAU[x][0]+'</button>'}).join('')+(k?'':'<span class="tag">tự chọn</span>')+'</div><div class="qlist">'+QK.map(function(r){return'<label class="qrow"><input type="checkbox" data-q="'+r[0]+'"'+(q.indexOf(r[0])>=0?' checked':'')+'><span><b>'+r[1]+'</b><span class="hint"> · '+r[2]+'</span></span></label>'}).join('')+'</div><div class="err" id="pq-e"></div><div class="row"><button class="btn" type="button" data-x>Hủy</button><button class="btn solid" type="button" data-ok>Lưu quyền</button></div>'}
 function bind(m){
  m.querySelector('[data-x]').onclick=closeModal;
  m.querySelectorAll('[data-mau]').forEach(function(b){b.onclick=function(){var pq=q.indexOf('phu_qt')>=0;q=MAU[b.dataset.mau][1].slice();if(pq)q.push('phu_qt');m.innerHTML=body();bind(m)}});
  m.querySelectorAll('[data-q]').forEach(function(c){c.onchange=function(){var k=c.dataset.q;q=q.filter(function(x){return x!==k});if(c.checked)q.push(k);m.innerHTML=body();bind(m);var n=m.querySelector('[data-q="'+k+'"]');if(n)n.focus()}});
  m.querySelector('[data-ok]').onclick=function(){var b=this;b.disabled=true;call('datQuyen',{ten_dn:u.ten_dn,quyen:q}).then(function(){closeModal();toast('Đã lưu quyền cho '+u.ho_ten);done();schedule(500)}).catch(function(e){b.disabled=false;m.querySelector('#pq-e').textContent=e.msg})};
 }
 openModal(body(),bind);
}

/* ================= khởi động ================= */
loadSession();
render();
if(ST.token&&ST.toi&&!ST.toi.doi_mk)startApp();
})();
</script>
